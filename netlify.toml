[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"

# Functions: Netlify's synchronous limit is 60 s and can't be configured (Netlify docs, Functions >
# Configuration, checked 2 Nov 2026). The per-party lock (src/lib/parties/party-lock.ts) keeps its
# 30 s lease alive with a heartbeat while an action runs and checks it before each write (fencing),
# so a request that runs past 30 s never overlaps another server's change of the same party.

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# Rebrand (Sep 2026): the old domain stays live only to forward people to the new one.
# PostHog through our own domain (see src/components/posthog.astro).
[[redirects]]
  from = "/hs-e/static/*"
  to = "https://us-assets.i.posthog.com/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/hs-e/*"
  to = "https://us.i.posthog.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://homegrowncraftstudio.com/*"
  to = "https://ourhometownstudio.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.homegrowncraftstudio.com/*"
  to = "https://ourhometownstudio.com/:splat"
  status = 301
  force = true

